trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "24.x"
  azureServiceConnection: "YOUR_AZURE_RM_SERVICE_CONNECTION"
  webAppName: "azureDevOpsPractice"

  # AzureWebApp@1 options (Linux)
  appType: "webAppLinux"
  runtimeStack: "NODE|24-lts"
  startUpCommand: "npm start"

steps:
  - checkout: self
    persistCredentials: true

  - task: NodeTool@0
    inputs:
      versionSpec: "$(nodeVersion)"

  - script: npm ci --omit=dev
    workingDirectory: "$(Build.SourcesDirectory)/sample-nodejs-ado"
    displayName: "Install production dependencies"

  # Deploy the folder contents (including node_modules) as a zip deploy.
  - task: AzureWebApp@1
    inputs:
      azureSubscription: "$(azureServiceConnection)"
      appType: "$(appType)"
      appName: "$(webAppName)"
      runtimeStack: "$(runtimeStack)"
      startUpCommand: "$(startUpCommand)"
      package: "$(Build.SourcesDirectory)/sample-nodejs-ado"

